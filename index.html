<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #FFFFFF;
      color: #333333;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      color: #FF7F32;
      margin-top: 50px;
    }

    .container {
      width: 350px;
      margin: 50px auto;
      padding: 30px;
      background-color: #f7f7f7;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    input[type="text"], input[type="button"], input[type="date"], textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    input[type="button"] {
      background-color: #FF7F32;
      color: white;
      cursor: pointer;
      border: none;
    }

    input[type="button"]:hover {
      background-color: #FF4C00;
    }

    input[type="button"]:disabled {
      background-color: #CCCCCC;
      color: #888888;
      cursor: not-allowed;
    }

    .button-container {
      margin-top: 20px;
    }

    .leave-request {
      margin-top: 30px;
      font-size: 16px;
      color: #FF7F32;
    }

    .leave-request button {
      background-color: #FF7F32;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .leave-request button:hover {
      background-color: #FF4C00;
    }

    .leave-form {
      display: none;
      margin-top: 20px;
    }

    .leave-form input[type="date"], .leave-form textarea {
      margin-bottom: 15px;
    }

    .leave-form textarea {
      height: 100px;
    }

    .leave-form button {
      background-color: #FF7F32;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .leave-form button:hover {
      background-color: #FF4C00;
    }

    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>Attendance Tracker</h1>

  <div class="container">
    <input type="text" id="phoneNumber" placeholder="Enter Phone Number" required>

    <div class="button-container">
      <input type="button" value="Login" id="loginBtn" onclick="track('login')">
      <input type="button" value="Logout" id="logoutBtn" onclick="track('logout')">
    </div>

    <div class="leave-request">
      <p>Need to take leave?</p>
      <button onclick="showLeaveForm()">Request Leave</button>
    </div>

    <div class="leave-form" id="leaveForm">
      <input type="date" id="leaveDate" required><br>
      <textarea id="leaveReason" placeholder="Enter reason for leave" required></textarea><br>
      <button onclick="submitLeaveRequest()">Submit Leave Request</button>
      <button onclick="cancelLeaveRequest()">Cancel</button>
    </div>
  </div>

  <div class="footer">
    <p>&copy; 2025 Attendance Tracker. All rights reserved.</p>
  </div>

  <script>
    const scriptUrl = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';
    let currentLocation = "";

    navigator.geolocation.getCurrentPosition(
      (position) => {
        currentLocation = `${position.coords.latitude},${position.coords.longitude}`;
      },
      (error) => {
        console.error('Error getting location', error);
      }
    );

    function track(action) {
      const phoneNumber = document.getElementById('phoneNumber').value;
      if (!phoneNumber) {
        alert("Please enter your phone number.");
        return;
      }

      fetch(scriptUrl, {
        method: 'POST',
        body: new URLSearchParams({
          action: action,
          phone: phoneNumber,
          location: currentLocation
        })
      })
      .then(res => res.text())
      .then(data => {
        alert(`${action.charAt(0).toUpperCase() + action.slice(1)} successful.`);
      })
      .catch(err => console.error('Error:', err));
    }

    function showLeaveForm() {
      document.getElementById('leaveForm').style.display = 'block';
      document.getElementById('loginBtn').disabled = true;
      document.getElementById('logoutBtn').disabled = true;
    }

    function submitLeaveRequest() {
      const phoneNumber = document.getElementById('phoneNumber').value;
      const leaveDate = document.getElementById('leaveDate').value;
      const leaveReason = document.getElementById('leaveReason').value;

      if (!phoneNumber || !leaveDate || !leaveReason) {
        alert("Please fill in all fields.");
        return;
      }

      fetch(scriptUrl, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'leave',
          phone: phoneNumber,
          leaveDate: leaveDate,
          reason: leaveReason
        })
      })
      .then(res => res.text())
      .then(data => {
        alert("Leave request submitted.");
        cancelLeaveRequest();
      })
      .catch(err => console.error('Error:', err));
    }

    function cancelLeaveRequest() {
      document.getElementById('leaveForm').style.display = 'none';
      document.getElementById('loginBtn').disabled = false;
      document.getElementById('logoutBtn').disabled = false;
      document.getElementById('leaveDate').value = '';
      document.getElementById('leaveReason').value = '';
    }
  </script>
</body>
</html>
