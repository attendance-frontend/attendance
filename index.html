<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login/Logout Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #FFFFFF;
      color: #333333;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      color: #FF7F32;
      margin-top: 50px;
    }

    .container {
      width: 350px;
      margin: 50px auto;
      padding: 30px;
      background-color: #f7f7f7;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    input[type="button"], .leave-form button, .leave-request button {
      background-color: #FF7F32;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px 0;
    }

    input[type="button"]:hover, .leave-form button:hover, .leave-request button:hover {
      background-color: #FF4C00;
    }

    input[type="button"]:disabled {
      background-color: #CCCCCC;
      color: #888888;
      cursor: not-allowed;
    }

    .button-container {
      margin-top: 20px;
    }

    .leave-request {
      margin-top: 30px;
      font-size: 16px;
      color: #FF7F32;
    }

    .leave-form {
      display: none;
      margin-top: 20px;
    }

    .leave-form textarea {
      height: 100px;
    }

    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }

    /* Toast styling */
    #toast {
      visibility: hidden;
      min-width: 250px;
      margin-left: -125px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 5px;
      padding: 16px;
      position: fixed;
      z-index: 1;
      left: 50%;
      bottom: 30px;
      font-size: 17px;
      opacity: 0;
      transition: opacity 0.5s ease, bottom 0.5s ease;
    }

    #toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 50px;
    }
  </style>
</head>
<body>

  <h1>Attendance Tracker</h1>

  <div class="container">
    <input type="text" id="phoneNumber" placeholder="Enter Phone Number" required>

    <div class="button-container">
      <input type="button" value="Login" id="loginBtn" onclick="track('login')">
      <input type="button" value="Logout" id="logoutBtn" onclick="track('logout')">
    </div>

    <div class="leave-request">
      <p>Need to take leave?</p>
      <button onclick="showLeaveForm()">Request Leave</button>
    </div>

    <div class="leave-form" id="leaveForm">
      <input type="date" id="leaveDate" required><br>
      <textarea id="leaveReason" placeholder="Enter reason for leave" required></textarea><br>
      <button onclick="submitLeaveRequest()">Submit Leave Request</button>
      <button onclick="cancelLeaveRequest()">Cancel</button>
    </div>
  </div>

  <div class="footer">
    <p>&copy; 2025 Attendance Tracker. All rights reserved.</p>
  </div>

  <!-- Toast container -->
  <div id="toast"></div>

  <script>
    let gpsLocation = "";

    // Collect GPS in background
    navigator.geolocation.getCurrentPosition(
      position => {
        gpsLocation = `${position.coords.latitude}, ${position.coords.longitude}`;
      },
      () => {
        showToast("Unable to fetch location. Please try again.", 5000); // Longer duration for location error
      }
    );

    function showToast(message, duration = 3000) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.className = "show";
      setTimeout(() => {
        toast.className = toast.className.replace("show", "");
      }, duration); // Duration is configurable (default 3000ms)
    }

    function track(action) {
      const phoneNumber = document.getElementById('phoneNumber').value;
      if (!phoneNumber) {
        showToast("Please enter your phone number.");
        return;
      }

      if (!gpsLocation) {
        showToast("Location not available yet. Try again shortly.");
        return;
      }

      // Call backend
      const data = {
        action: action,
        phone: phoneNumber,
        location: gpsLocation
      };

      sendToBackend(data);
    }

    function submitLeaveRequest() {
      const phoneNumber = document.getElementById('phoneNumber').value;
      const leaveDate = document.getElementById('leaveDate').value;
      const leaveReason = document.getElementById('leaveReason').value;

      if (!phoneNumber || !leaveDate || !leaveReason) {
        showToast("Please fill in all fields.");
        return;
      }

      // Prepare data for leave request
      const data = {
        action: 'leave',
        phone: phoneNumber,
        leaveDate: leaveDate,
        reason: leaveReason
      };

      sendToBackend(data);
    }

    function sendToBackend(data) {
      // Make a POST request to the Google Apps Script backend
      fetch('https://script.google.com/macros/s/AKfycbxrSh9HkfM_iQmMdqgKiFGxRpFnlniPBHsJRZ19UsnbOyZ0-UdXbDCMJDDIqCFXQS2Ocw/exec', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: new URLSearchParams(data)
      })
      .then(response => response.text())
      .then(responseText => {
        showToast(responseText);  // Show backend response as toast notification
      })
      .catch(error => {
        showToast('Error: ' + error.message);
      });
    }

    function showLeaveForm() {
      document.getElementById('leaveForm').style.display = 'block';
      document.getElementById('loginBtn').disabled = true;
      document.getElementById('logoutBtn').disabled = true;
    }

    function cancelLeaveRequest() {
      document.getElementById('leaveForm').style.display = 'none';
      document.getElementById('loginBtn').disabled = false;
      document.getElementById('logoutBtn').disabled = false;
      document.getElementById('leaveDate').value = '';
      document.getElementById('leaveReason').value = '';
    }
  </script>

</body>
</html>
