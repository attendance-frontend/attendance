<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; max-width: 500px; margin: auto; }
    label, input, select, textarea, button { display: block; width: 100%; margin: 1rem 0; }
  </style>
</head>
<body>

  <h2>Google Meet Attendance</h2>

  <form id="attendanceForm">
    <label>Email:
      <input type="email" id="email" required>
    </label>

    <label>Action:
      <select id="action" required>
        <option value="">-- Select --</option>
        <option value="Login">Login</option>
        <option value="Logout">Logout</option>
        <option value="Leave">Leave Request</option>
      </select>
    </label>

    <label>Reason (optional for Leave):
      <textarea id="reason"></textarea>
    </label>

    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <script>
    const form = document.getElementById('attendanceForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Submitting...';

      const email = document.getElementById('email').value;
      const action = document.getElementById('action').value;
      const reason = document.getElementById('reason').value;

      navigator.geolocation.getCurrentPosition(async (position) => {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        const payload = {
          email,
          action,
          reason,
          latitude,
          longitude
        };

        try {
          await fetch('https://script.google.com/macros/s/AKfycbyEDgkBWO__yDRaZLrwqV-W5PvHRRZZlpF1E75uRbpw99QUWSU9MX5-D08fda6LlwE1zg/exec', {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });
          status.textContent = "Submitted!";
        } catch (error) {
          status.textContent = "Error submitting data.";
          console.error(error);
        }
      }, () => {
        status.textContent = "Unable to fetch location.";
      });
    });
  </script>

</body>
</html>
