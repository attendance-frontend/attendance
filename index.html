<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      color: black;
    }
    .container {
      width: 80%;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
      background-color: #ff6600;
      color: white;
      border-radius: 8px;
    }
    h1 {
      color: white;
    }
    input, button, textarea {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
    }
    button {
      cursor: pointer;
      background-color: #ff6600;
      color: white;
    }
    button:disabled {
      background-color: #ccc;
      color: #666;
    }
    #leaveRequestBtn {
      background-color: #ff9900;
    }
    #loginLogoutButtons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    #leaveForm {
      background-color: white;
      color: black;
      padding: 20px;
      border-radius: 8px;
    }
    textarea {
      width: 80%;
      height: 80px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Attendance Tracker</h1>

    <!-- Phone Number Input -->
    <input type="text" id="phoneNumber" placeholder="Enter Phone Number (10 digits)" maxlength="10" required />

    <!-- Hidden Location Storage -->
    <input type="hidden" id="location" />

    <!-- Leave Request -->
    <button id="leaveRequestBtn" onclick="requestLeave()">Leave Request</button>

    <!-- Login/Logout Buttons -->
    <div id="loginLogoutButtons">
      <button id="loginBtn" onclick="login()">Login</button>
      <button id="logoutBtn" onclick="logout()">Logout</button>
    </div>

    <!-- Leave Request Form -->
    <div id="leaveForm" style="display: none;">
      <h2>Leave Request Form</h2>
      <input type="date" id="leaveDate" required />
      <textarea id="reason" placeholder="Reason for leave" required></textarea>
      <br />
      <button id="submitLeaveBtn" onclick="submitLeave()">Submit Leave Request</button>
      <button id="cancelLeaveBtn" onclick="cancelLeave()">Cancel</button>
    </div>
  </div>

  <script>
    const scriptUrl = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec'; // Replace with actual URL
    let currentLocation = "";

    function fetchLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            currentLocation = `${position.coords.latitude.toFixed(6)},${position.coords.longitude.toFixed(6)}`;
            document.getElementById('location').value = currentLocation;
          },
          (error) => {
            console.error("Location error:", error);
            alert("Unable to fetch location. Please allow location access.");
          }
        );
      } else {
        alert("Geolocation is not supported by this browser.");
      }
    }

    function requestLeave() {
      document.getElementById('leaveForm').style.display = 'block';
      document.getElementById('loginLogoutButtons').style.display = 'none';
      document.getElementById('leaveRequestBtn').disabled = true;
    }

    function cancelLeave() {
      document.getElementById('leaveForm').style.display = 'none';
      document.getElementById('loginLogoutButtons').style.display = 'flex';
      document.getElementById('leaveRequestBtn').disabled = false;
    }

    function submitLeave() {
      const phone = document.getElementById('phoneNumber').value;
      const leaveDate = document.getElementById('leaveDate').value;
      const reason = document.getElementById('reason').value;

      fetch(scriptUrl, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'leave',
          phone: phone,
          leaveDate: leaveDate,
          reason: reason
        })
      })
      .then(response => response.text())
      .then(data => {
        alert('Leave request submitted');
        console.log(data);
        cancelLeave();
      })
      .catch(error => console.error('Error:', error));
    }

    function login() {
      const phone = document.getElementById('phoneNumber').value;

      fetch(scriptUrl, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'login',
          phone: phone,
          location: currentLocation
        })
      })
      .then(response => response.text())
      .then(data => {
        alert('Login successful');
        console.log(data);
      })
      .catch(error => console.error('Error:', error));
    }

    function logout() {
      const phone = document.getElementById('phoneNumber').value;

      fetch(scriptUrl, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'logout',
          phone: phone,
          location: currentLocation
        })
      })
      .then(response => response.text())
      .then(data => {
        alert('Logout successful');
        console.log(data);
      })
      .catch(error => console.error('Error:', error));
    }

    window.onload = fetchLocation;
  </script>
</body>
</html>
